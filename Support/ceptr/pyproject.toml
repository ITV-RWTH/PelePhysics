[tool.poetry]
name = "ceptr"
version = "0.1.0"
description = ""
authors = ["Marc Henry de Frahan <marc.henrydefrahan@nrel.gov>", "Lucas Esclapez", "Jon Rood", "Hari Sitaraman", "Marc Day", "Anne Felden", "Julia Ream", "Malik Hassanaly", "Nick Wimer"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
Cantera = ">=3.2.0"
Pint = "^0.24"
PyYAML = "^6.0.1"
networkx = "^2.8.8"
matplotlib = "^3.10.0"
scipy = "^1.16.1"
numpy = "^2.3.0"
sympy = "==1.14"
symengine = "^0.14.1"
pandas = ">=2.3.3"
toml = ">=0.10.2"
pyarrow = ">=19.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.17.4"
ipython = "^8.14.0"
clang-format = "==20.1.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
convert = "ceptr.ceptr:main"
qssa = "ceptr.qssa:main"
check-mechanisms = "ceptr.check_mechanisms:main"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
# Same rule families as the former flake8 setup: pycodestyle (E, W),
# pyflakes (F), mccabe (C90), bugbear (B), pep8-naming (N),
# pydocstyle (D), flynt / flake8-use-fstring (FLY, UP031, UP032)
# and isort (I).
select = ["E", "W", "F", "C90", "B", "N", "D", "FLY", "UP031", "UP032", "I"]
# B905 (zip strict=) is newer than the former flake8-bugbear pin; adding
# strict= would change runtime behaviour, so it stays off.
ignore = ["E501", "C901", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]
